name: build android apk

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build debug apk
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: set up java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android SDK environment
        run: |
          echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/Android/Sdk" >> $GITHUB_ENV
          mkdir -p "$HOME/Android/Sdk"

      - name: Download and install Android command-line tools
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -e
          cd "$HOME"
          CLT_ZIP="commandlinetools-linux-9477386_latest.zip"
          CLT_URL="https://dl.google.com/android/repository/${CLT_ZIP}"
          mkdir -p tmp-android-clt
          curl -fsSL "$CLT_URL" -o "tmp-android-clt/$CLT_ZIP"
          unzip -q "tmp-android-clt/$CLT_ZIP" -d tmp-android-clt
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv tmp-android-clt/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          rm -rf tmp-android-clt

      - name: Add Android tools to PATH
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -e
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Verify Android SDK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --version
          ls -la "$ANDROID_SDK_ROOT/platforms" || true
          ls -la "$ANDROID_SDK_ROOT/build-tools" || true

      - name: Ensure repo-root gradle.properties (enable AndroidX) and commit if needed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # desired content
          cat > /tmp/desired_gradle_properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g
          EOF

          # Normalize by removing leading indentation/spaces
          sed -i 's/^[[:space:]]*//' /tmp/desired_gradle_properties

          if [ -f gradle.properties ] && cmp -s gradle.properties /tmp/desired_gradle_properties; then
            echo "gradle.properties already present and identical — skipping commit"
          else
            echo "Updating gradle.properties in repo workspace"
            mv /tmp/desired_gradle_properties gradle.properties
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradle.properties
            # Commit with [skip ci] to avoid retriggering workflows
            if git diff --staged --quiet; then
              echo "No changes to commit"
            else
              git commit -m "chore(ci): add/update gradle.properties to enable AndroidX (android.useAndroidX=true) [skip ci]" || true
              # Attempt to push to main
              echo "Pushing gradle.properties to origin main"
              git push origin HEAD:main || (echo "Push failed — possibly branch protection. File created in workspace, build will continue." && true)
            fi
          fi

      - name: make gradle wrapper executable
        run: chmod +x gradlew

      - name: build debug apk
        run: ./gradlew assembleDebug --stacktrace --info

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
