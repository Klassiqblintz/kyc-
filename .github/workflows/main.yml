name: build android apk

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build debug apk
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: set up java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android SDK environment
        run: |
          echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> $GITHUB_ENV
          mkdir -p "$HOME/Android/Sdk"

      - name: Download and install Android command-line tools
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -e
          cd "$HOME"
          CLT_ZIP="commandlinetools-linux-9477386_latest.zip"
          CLT_URL="https://dl.google.com/android/repository/${CLT_ZIP}"
          mkdir -p tmp-android-clt
          curl -fsSL "$CLT_URL" -o "tmp-android-clt/$CLT_ZIP"
          unzip -q "tmp-android-clt/$CLT_ZIP" -d tmp-android-clt
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv tmp-android-clt/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          rm -rf tmp-android-clt

      - name: Add Android tools to PATH
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -e
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --list

      - name: Verify android sdk
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --version
          ls "$ANDROID_SDK_ROOT/platforms" || true
          ls "$ANDROID_SDK_ROOT/build-tools" || true

      - name: make gradle wrapper executable
        run: chmod +x gradlew

      - name: build debug apk
        run: ./gradlew assembleDebug --stacktrace

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
